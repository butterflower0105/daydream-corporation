function readImageCompressed(file,maxW=800,maxH=800,quality=0.7){return new Promise((resolve,reject)=>{
const reader=new FileReader();
reader.onload=ev=>{const img=new Image();
img.onload=()=>{let w=img.width,h=img.height;
if(w>maxW||h>maxH){const r=Math.min(maxW/w,maxH/h);w=Math.round(w*r);h=Math.round(h*r)}
const cv=document.createElement('canvas');cv.width=w;cv.height=h;
cv.getContext('2d').drawImage(img,0,0,w,h);
resolve(cv.toDataURL('image/jpeg',quality))};
img.onerror=reject;img.src=ev.target.result};
reader.onerror=reject;reader.readAsDataURL(file)})}

if(u.off){$('#lerr').textContent=u.reason;return false}

function invList(){const A=adm();const cs=D.inv.cases.filter(c=>!c.parentId).sort((a,b)=>(a.status===b.status?0:a.status==='active'?-1:1)||b.id-a.id);

function invNewForm(){return card('시나리오 생성',`<div style="max-width:560px">${fld('ivt','제목 (필수)')}<label>도입부 서술 (선택)</label><textarea id="ivintro" placeholder="예: 앞 쪽에 커다란 숲과 바위가 보입니다..."></textarea>${fld('ivsc','참가 정원','number',`value="${D.inv.slotCount||6}"`)}<div style="margin-top:14px"><button class="pri" onclick="invCreate()">생성</button> <button class="btn" onclick="S.tab='';R()">취소</button></div></div>`)}
function invCreate(){if(!need())return;const t=v('ivt');if(!t)return alert('제목을 입력하세요.');
const sc=Math.max(1,+v('ivsc')||D.inv.slotCount||6);const intro=($('#ivintro')?.value||'').trim();
const id=nx(D.inv.cases);
D.inv.cases.push({id,title:t,status:'active',slotCount:sc,slots:Array(sc).fill(null),log:intro?[{id:1,type:'narr',text:intro,d:now()}]:[],parentId:null,seenAt:{},d:now()});

function openInv(id){const c=D.inv.cases.find(x=>x.id===id);if(!c)return;S.invOpen=id;S.tab='';markCaseSeen(c,S.uid);save();R()}
function markCaseSeen(c,uid){c.seenAt=c.seenAt||{};c.seenAt[uid]=c.log.length?c.log[c.log.length-1].id:0}
function invCaseView(c){const A=adm(),uid=S.uid,isP=c.slots.includes(uid),filled=c.slots.filter(Boolean).length,active=c.status==='active';
const slotsHtml=c.slots.map((s,i)=>s?`<div class="prod" style="flex:0 0 150px"><b>${e(nm(s))}</b>${(s===uid||A)?`<div style="margin-top:8px"><button class="btn ${s!==uid?'dg':''}" onclick="releaseSlot(${c.id},${i})">${s===uid?'자리 비우기':'강제 비우기'}</button></div>`:''}</div>`:`<div class="prod" style="flex:0 0 150px"><span class="mu">빈 자리</span>${(!isP&&active)?`<div style="margin-top:8px"><button class="btn" onclick="claimSlot(${c.id},${i})">참가 신청</button></div>`:''}</div>`).join('');
const logHtml=c.log.length?c.log.map(en=>{
if(en.type==='chat')return`<div class="ivchat ${en.uid===uid?'me':''}"><b style="font-size:11px;opacity:.7;display:block">${e(nm(en.uid))}</b>${e(en.text)}</div>`;
if(en.type==='dice'){if(en.mode==='stat')return`<div class="ivdice">🎲 ${e(nm(en.uid))}님의 ${STATN[en.statKey]||en.statKey} 판정 — D100: <b>${en.roll}</b> / ${en.statVal} → ${en.success?'<span class="b-ok" style="font-weight:700">성공</span>':'<span class="rd" style="font-weight:700">실패</span>'}</div>`;
return`<div class="ivdice">🎲 ${e(nm(en.uid))}님의 주사위 (${e(en.notation)}): [${en.rolls.join(', ')}]${en.mod?(en.mod>0?' +'+en.mod:' '+en.mod):''} = <b>${en.total}</b></div>`}
if(en.type==='choice'){const tally={};Object.values(en.votes||{}).forEach(o=>tally[o]=(tally[o]||0)+1);
const opts=en.options.map(o=>{const cnt=tally[o.id]||0,isWin=en.resolved===o.id,canVote=isP&&active&&!en.resolved;
return`<button class="btn ivopt ${isWin?'win':''}" ${canVote?`onclick="voteChoice(${c.id},${en.id},'${o.id}')"`:'disabled'}>${e(o.label)} (${cnt}표)${isWin?' ✓':''}</button>`}).join('');
return`<div class="ivchoice">${e(en.text).replace(/\n/g,'<br>')}<div style="margin-top:8px">${opts}</div>${(!en.resolved&&A)?`<div style="margin-top:8px"><button class="btn" onclick="resolveChoiceForce(${c.id},${en.id})">투표 마감(수동)</button></div>`:''}</div>`}
return`<div class="ivnarr">${e(en.text).replace(/\n/g,'<br>')}</div>`}).join(''):empty('아직 진행 기록이 없습니다.');
const children=D.inv.cases.filter(x=>x.parentId===c.id);
const parent=c.parentId?D.inv.cases.find(x=>x.id===c.parentId):null;
const parentLink=parent?`<div class="mu" style="margin-bottom:10px">상위 시나리오: <a onclick="openInv(${parent.id})">${e(parent.title)}</a></div>`:'';
const childLinks=children.length?`<div class="mu" style="margin-bottom:10px">분기: ${children.map(ch=>`<a onclick="openInv(${ch.id})">${e(ch.title)}</a>`).join(', ')}</div>`:'';
const diceBox=(isP&&active)?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding-top:10px;border-top:1px dashed var(--ln)">
<select id="iv_stat">${Object.keys(STATN).map(k=>`<option value="${k}">${STATN[k]} (${(me().stats&&me().stats[k])??50})</option>`).join('')}</select>
<button class="btn" onclick="rollStatDice(${c.id})">🎲 D100 판정</button>
<input id="iv_dice" placeholder="예: 2d6+1" style="width:110px">
<button class="btn" onclick="rollCustomDice(${c.id})">🎲 주사위 굴리기</button>
</div>`:'';
const chatBox=(isP&&active)?`<div style="display:flex;gap:8px;margin-top:4px"><input id="iv_chat" placeholder="채팅 입력 후 Enter" onkeydown="if(event.key==='Enter'){postChat(${c.id});event.preventDefault()}"><button class="btn" onclick="postChat(${c.id})">전송</button></div>${diceBox}`:(active?empty('참가 신청 후 채팅·투표·주사위에 참여할 수 있습니다. (관전은 자유롭게 가능합니다)'):'');
const adminTools=A?`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0"><button class="btn" onclick="toggleCaseStatus(${c.id})">${active?'시나리오 종료':'시나리오 재개'}</button><button class="btn" onclick="branchCase(${c.id})">분기 생성</button><button class="btn dg" onclick="deleteCase(${c.id})">삭제</button></div>`:'';
const adminPanel=(A&&active)?card('진행 서술 작성',`<textarea id="iv_narr" placeholder="서술 내용을 입력하세요"></textarea>${fld('iv_opts','선택지 (쉼표로 구분, 비우면 선택지 없는 서술로 등록)')}<button class="pri" onclick="postNarr(${c.id})">등록</button>`):'';
return card(`${e(c.title)}${!active?' <span class="mu">(종료됨)</span>':''}`,`<button class="btn" style="margin-bottom:14px" onclick="S.invOpen=null;R()">목록으로</button>`+parentLink+childLinks+`<div class="mu" style="margin-bottom:10px">참가 인원 ${filled} / ${c.slotCount}</div><div class="grid" style="margin-bottom:16px">${slotsHtml}</div>`+adminTools+`<div class="invlog">${logHtml}</div>`+chatBox)+adminPanel}
function claimSlot(caseId,idx){const c=D.inv.cases.find(x=>x.id===caseId);if(!c||c.status!=='active')return alert('종료된 시나리오입니다.');
if(c.slots.includes(S.uid))return alert('이미 참가 중인 시나리오입니다.');if(c.slots[idx])return alert('이미 선점된 자리입니다.');
c.slots[idx]=S.uid;save();R()}
function releaseSlot(caseId,idx){const c=D.inv.cases.find(x=>x.id===caseId);if(!c)return;if(c.slots[idx]!==S.uid&&!adm())return;
c.slots[idx]=null;save();R()}
function postNarr(caseId){if(!need())return;const c=D.inv.cases.find(x=>x.id===caseId);const t=($('#iv_narr')?.value||'').trim();if(!t)return alert('서술 내용을 입력하세요.');
const optsRaw=v('iv_opts');const opts=optsRaw?optsRaw.split(',').map(s=>s.trim()).filter(Boolean).map((label,i)=>({id:String.fromCharCode(97+i),label})):[];
const id=nx(c.log);c.log.push(opts.length?{id,type:'choice',text:t,options:opts,votes:{},resolved:null,d:now()}:{id,type:'narr',text:t,d:now()});save();R()}
function postChat(caseId){const c=D.inv.cases.find(x=>x.id===caseId);if(!c||c.status!=='active'||!c.slots.includes(S.uid))return;
const inp=$('#iv_chat');const t=(inp?.value||'').trim();if(!t)return;c.log.push({id:nx(c.log),type:'chat',uid:S.uid,text:t,d:now()});save();if(inp)inp.value='';R()}
function rollStatDice(caseId){const c=D.inv.cases.find(x=>x.id===caseId);if(!c||c.status!=='active'||!c.slots.includes(S.uid))return;
const statKey=$('#iv_stat')?.value||'str',u=me(),statVal=(u.stats&&u.stats[statKey])??50,roll=1+Math.floor(Math.random()*100),success=roll<=statVal;
c.log.push({id:nx(c.log),type:'dice',mode:'stat',uid:S.uid,statKey,statVal,roll,success,d:now()});save();R()}
function rollCustomDice(caseId){const c=D.inv.cases.find(x=>x.id===caseId);if(!c||c.status!=='active'||!c.slots.includes(S.uid))return;
const raw=($('#iv_dice')?.value||'').trim();const m=raw.match(/^(\d*)d(\d+)([+-]\d+)?$/i);if(!m)return alert('주사위 표기법이 올바르지 않습니다. 예: 2d6, 1d100+5');
const n=Math.min(20,Math.max(1,+m[1]||1)),sides=Math.max(2,+m[2]),mod=+m[3]||0;
const rolls=Array.from({length:n},()=>1+Math.floor(Math.random()*sides));
const total=rolls.reduce((a,b)=>a+b,0)+mod;
c.log.push({id:nx(c.log),type:'dice',mode:'custom',uid:S.uid,notation:raw,rolls,mod,total,d:now()});save();if($('#iv_dice'))$('#iv_dice').value='';R()}
function resolveChoice(en){const tally={};Object.values(en.votes||{}).forEach(o=>tally[o]=(tally[o]||0)+1);
let win=en.options[0].id,max=-1;en.options.forEach(o=>{const c=tally[o.id]||0;if(c>max){max=c;win=o.id}});en.resolved=win}
function voteChoice(caseId,entryId,optId){const c=D.inv.cases.find(x=>x.id===caseId);if(!c||c.status!=='active'||!c.slots.includes(S.uid))return;
const en=c.log.find(x=>x.id===entryId);if(!en||en.type!=='choice'||en.resolved)return;
en.votes=en.votes||{};en.votes[S.uid]=optId;
const filled=c.slots.filter(Boolean);if(filled.length&&filled.every(u=>en.votes[u]!==undefined))resolveChoice(en);
save();R()}
function resolveChoiceForce(caseId,entryId){if(!need())return;const c=D.inv.cases.find(x=>x.id===caseId);const en=c.log.find(x=>x.id===entryId);
if(!en||en.resolved)return;resolveChoice(en);save();R()}
function toggleCaseStatus(caseId){if(!need())return;const c=D.inv.cases.find(x=>x.id===caseId);c.status=c.status==='active'?'closed':'active';save();R()}
function branchCase(parentId){if(!need())return;const p=D.inv.cases.find(x=>x.id===parentId);const t=prompt('분기 시나리오 제목을 입력하세요.');if(!t)return;
const nc={id:nx(D.inv.cases),title:t,status:'active',slotCount:p.slotCount,slots:[...p.slots],log:[],parentId:p.id,seenAt:{},d:now()};
D.inv.cases.push(nc);save();S.invOpen=nc.id;R()}
function deleteCase(id){if(!need()||!confirm('시나리오를 삭제할까요? 하위 분기도 함께 삭제됩니다.'))return;
const ids=new Set([id]);let ch=true;while(ch){ch=false;D.inv.cases.forEach(c=>{if(c.parentId&&ids.has(c.parentId)&&!ids.has(c.id)){ids.add(c.id);ch=true}})}
D.inv.cases=D.inv.cases.filter(c=>!ids.has(c.id));if(S.invOpen&&ids.has(S.invOpen))S.invOpen=null;save();R()}
P.admin=()=>{if(!adm())return'';const t=S.tab;
if(t==='an')return card('공지사항 작성',`<div style="max-width:640px">${fld('nt','제목 (필수)')}<label>본문 (필수)</label><textarea id="nb"></textarea><label class="ck"><input type="checkbox" id="ni">중요 공지로 표시</label><label class="ck"><input type="checkbox" id="nc">오염된 공지로 표시</label>${fld('ncov','오염 안내 문구 (선택, 비우면 기본 문구 사용)')}<button class="pri" onclick="addN()">공지 등록</button></div>`);
if(t==='bd')return card('게시판 설정',`<label class="ck"><input type="checkbox" id="bwa" ${D.boardWriteAll?'checked':''}>전체 사원에게 글쓰기 허용 (해제 시 관리자만 작성 가능, 댓글은 항상 전체 허용)</label><label class="ck" style="margin-top:8px"><input type="checkbox" id="ban" ${D.boardAnon?'checked':''}>모든 사용자를 익명으로 표시 (관리자에게는 실명이 함께 표시됩니다)</label><button class="btn" style="margin-top:10px" onclick="saveBoardSettings()">설정 저장</button><h4 style="margin-top:22px">게시판 목록</h4>${tbl(['이름','관리'],D.boards.map(b=>`<tr><td class="l">${e(b.n)}</td><td class="nw"><button class="btn" onclick="renameBoard(${b.id})">이름 변경</button> <button class="btn dg" onclick="delBoard(${b.id})">삭제</button></td></tr>`))}<div style="margin-top:14px;max-width:360px">${fld('nbn','새 게시판 이름')}<button class="btn" onclick="addBoard()">게시판 추가</button></div>`);
if(t==='mon'){const ms=[...D.msgs].sort((a,b)=>b.d.localeCompare(a.d));
return card('쪽지 모니터링',empty('사원들이 주고받은 모든 쪽지를 확인할 수 있습니다. (관리자 전용)')+(ms.length?tbl(['보낸 사람','받는 사람','제목','일시'],ms.map(m=>`<tr><td>${e(nm(m.from))}</td><td>${m.to==='*'?'전체':e(nm(m.to))}</td><td class="l"><a onclick="readM(${m.id})">${m.spam?'<b class="rd">[스팸] </b>':''}${m.corrupted?'🔒 오염된 쪽지':e(m.t)}</a></td><td>${fmt(m.d)}</td></tr>`)):empty('주고받은 쪽지가 없습니다.')))}
if(t==='set')return card('사이트 설정',`<div style="max-width:640px">${fld('sco','회사명','text',`value="${e(D.co)}"`)}${fld('smk','관리자 마크 라벨','text',`value="${e(D.mark)}"`)}<h4>메뉴 설정</h4><table><tr><th>메뉴</th><th>이름</th><th>표시</th></tr>${D.menus.map((m,i)=>`<tr><td>${m.k}</td><td><input id="mn${i}" value="${e(m.n)}"></td><td><input type="checkbox" id="mv${i}" ${m.v?'checked':''} ${m.k==='admin'?'disabled':''}></td></tr>`).join('')}</table><h4>상담 탭 설정</h4><label>안내 문구 (상담 시작 전 표시)</label><textarea id="sci" style="min-height:90px">${e(D.counselIntro)}</textarea>${fld('scn','상담사 표시 이름','text',`value="${e(D.counselName)}"`)}<label>색상 커스터마이징</label>${(()=>{const c=D.counselColors,cs=[['bg1','배경1'],['bg2','배경2'],['bd','테두리'],['acc','아이콘'],['txt','안내 문구'],['emp','내 말풍선'],['empt','내 글자'],['adm','상담사 말풍선'],['admt','상담사 글자']];return`<div class="ccolor-row">${cs.map(x=>`<label>${x[1]}<input type="color" id="cc_${x[0]}" value="${c[x[0]]}"></label>`).join('')}</div>`})()}<button class="btn" onclick="resetCounselColors()">색상 기본값으로</button><button class="pri" onclick="saveSet()">저장</button></div>`);
const rows=D.users.map(u=>{const main=u.role==='main';return`<tr><td>${e(u.id)}</td><td>${e(u.name)}${u.role!=='user'?MK():''}</td><td>${e(u.dept)}</td><td>${e(u.rank)}</td><td>${u.pts} P</td><td>${main?'메인 관리자':u.role==='admin'?'관리자':'사원'}</td><td class="${u.off?'rd':''}">${u.off?'비활성':'정상'}</td><td class="nw"><button class="btn" onclick="editU('${u.id}')">수정</button> <button class="btn" onclick="togU('${u.id}')">${u.off?'활성화':'비활성'}</button> ${main?'':`<button class="btn" onclick="roleU('${u.id}')">${u.role==='admin'?'관리자 해임':'관리자 임명'}</button> `}<button class="btn dg" onclick="delU('${u.id}')">삭제</button></td></tr>`});
return`<div class="two">${card('사원 목록',tbl(['아이디','이름','부서','직급','포인트','권한','상태','관리'],rows))}<div class="card side"><h3>계정 생성</h3>${fld('cid','아이디 (필수)')}${fld('cpw','비밀번호 (필수)','password')}${fld('cnm','이름 (필수)')}${fld('cdp','부서')}${fld('ctm','소속 팀')}${fld('cal','가면(호칭)')}${fld('crk','직급')}<button class="pri" onclick="addU()">계정 생성</button></div></div>`};
function addN(){if(!need())return;const t=v('nt'),b=v('nb');if(!t||!b)return alert('제목과 본문은 필수입니다.');D.notices.push({id:nx(D.notices),t,b,imp:$('#ni').checked?1:0,corrupted:$('#nc').checked?1:0,cover:v('ncov'),d:now(),seenBy:[S.uid]});save();S.pg='notices';R()}
function saveSet(){if(!need())return;D.co=v('sco')||D.co;D.mark=v('smk')||D.mark;D.menus.forEach((m,i)=>{m.n=v('mn'+i)||m.n;m.v=m.k==='admin'||$('#mv'+i).checked?1:0});
if($('#sci'))D.counselIntro=$('#sci').value.trim()||D.counselIntro;
if($('#scn'))D.counselName=v('scn')||D.counselName;
if($('#cc_bg1')){['bg1','bg2','bd','acc','txt','emp','empt','adm','admt'].forEach(k=>{const el=$('#cc_'+k);if(el)D.counselColors[k]=el.value});}
save();R();alert('저장되었습니다.')}
function resetCounselColors(){D.counselColors={bg1:'#fff8f0',bg2:'#ffead2',bd:'#ffdcb0',acc:'#c9832f',txt:'#8a4b16',emp:'#ffb46e',empt:'#3a2410',adm:'#ffffff',admt:'#5a3a1a'};save();R()}
function saveBoardSettings(){if(!need())return;D.boardWriteAll=$('#bwa').checked?1:0;D.boardAnon=$('#ban').checked?1:0;save();R();alert('저장되었습니다.')}
function addBoard(){if(!need())return;const n=v('nbn');if(!n)return alert('게시판 이름을 입력하세요.');D.boards.push({id:nx(D.boards),n});save();R()}
function renameBoard(id){if(!need())return;const b=D.boards.find(x=>x.id===id);const n=prompt('게시판 이름',b.n);if(!n)return;b.n=n;save();R()}
function delBoard(id){if(!need())return;if(D.boards.length<=1)return alert('최소 1개의 게시판은 유지해야 합니다.');if(!confirm('게시판을 삭제하면 해당 게시판의 글도 모두 삭제됩니다. 삭제할까요?'))return;D.boards=D.boards.filter(x=>x.id!==id);D.posts=D.posts.filter(x=>x.boardId!==id);save();R()}
function addU(){if(!need())return;const id=v('cid'),pw=$('#cpw').value,n=v('cnm');
if(!id||!pw||!n)return alert('아이디, 비밀번호, 이름은 필수입니다.');if(!/^[A-Za-z0-9_]+$/.test(id))return alert('아이디는 영문, 숫자, 밑줄만 사용할 수 있습니다.');if(U(id))return alert('이미 사용 중인 아이디입니다.');
D.users.push({id,pw,name:n,dept:v('cdp'),team:v('ctm'),alias:v('cal'),rank:v('crk'),pts:0,role:'user',off:0,reason:'',buys:{},cbuys:{},stats:{str:50,dex:50,int:50,luk:50}});save();R()}
function editU(id){if(!need())return;const u=U(id);u.stats=u.stats||{str:50,dex:50,int:50,luk:50};
modal('사원 정보 수정','',`<div style="max-width:420px">${fld('eu_id','아이디','text',`value="${e(u.id)}" disabled`)}${fld('eu_pw','비밀번호','text',`value="${e(u.pw)}"`)}${fld('eu_name','이름 (필수)','text',`value="${e(u.name)}"`)}${fld('eu_dept','부서','text',`value="${e(u.dept)}"`)}${fld('eu_team','소속 팀','text',`value="${e(u.team)}"`)}${fld('eu_alias','가면(호칭)','text',`value="${e(u.alias)}"`)}${fld('eu_rank','직급','text',`value="${e(u.rank)}"`)}<h4 style="margin-top:16px">능력치 (D100 판정 기준, 0~100)</h4><div style="display:flex;gap:10px;flex-wrap:wrap">${Object.keys(STATN).map(k=>`<div style="flex:1 1 80px">${fld('eu_'+k,STATN[k],'number',`value="${u.stats[k]??50}" min="0" max="100"`)}</div>`).join('')}</div><button class="pri" onclick="saveU('${id}')">저장</button></div>`)}
function saveU(id){const u=U(id),name=$('#eu_name').value.trim();if(!name)return alert('이름은 비울 수 없습니다.');
u.pw=$('#eu_pw').value.trim()||u.pw;u.name=name;u.dept=$('#eu_dept').value.trim();u.team=$('#eu_team').value.trim();u.alias=$('#eu_alias').value.trim();u.rank=$('#eu_rank').value.trim();
u.stats=u.stats||{};Object.keys(STATN).forEach(k=>{const el=$('#eu_'+k);if(el)u.stats[k]=Math.max(0,Math.min(100,+el.value||0))});
save();document.querySelector('.ov')?.remove();R()}
function togU(id){if(!need())return;const u=U(id);
if(u.off){u.off=0;u.reason='';save();R();return}
if(u.role==='main')return alert('메인 관리자는 비활성화할 수 없습니다.');
const r=prompt('비활성화 사유를 입력하십시오.\n(로그인 시도 시 사원에게 이 문구가 표시됩니다.)','비활성화된 계정입니다. 관리자에게 문의하십시오.');
if(r===null)return;if(!r.trim())return alert('사유를 입력해야 비활성화할 수 있습니다.');
u.off=1;u.reason=r.trim();save();R()}
function roleU(id){if(!need())return;const u=U(id);if(u.role==='main')return;u.role=u.role==='admin'?'user':'admin';save();R()}
function delU(id){if(!need())return;const u=U(id);if(u.role==='main')return alert('메인 관리자는 삭제할 수 없습니다.');if(!confirm(`${u.name} 계정을 삭제할까요?`))return;D.users=D.users.filter(x=>x.id!==id);save();R()}
boot();
</script></body></html>
