if(S.tab==='chat'&&S.counselOpen){const c=D.counsel.find(x=>x.id===S.counselOpen);
if(c)return card(`${e(nm(c.uid))}님과의 상담 (${c.date})`,counselChatBox(c,true)+`<button class="btn" style="margin-top:12px" onclick="S.counselOpen=null;S.tab='list';R()">목록으로</button>`)}
const sorted=[...D.counsel].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
const rows=sorted.map(c=>`<tr><td class="l">${c.unreadAdm?'<span class="udot"></span>':''}${e(nm(c.uid))}</td><td>${c.date}</td><td>${c.msgs.length}건</td><td><button class="btn" onclick="S.counselOpen=${c.id};S.tab='chat';R()">${c.date===td?'입장':'열람'}</button></td></tr>`);
return card(e(counselLabel())+' · 상담 목록',sorted.length?tbl(['사원','날짜','대화 수','관리'],rows):empty('접수된 상담이 없습니다.'))}
function counselChatBox(c,isAdmin){if(isAdmin){if(c.unreadAdm){c.unreadAdm=0;save()}}else{if(c.unreadEmp){c.unreadEmp=0;save()}}
const msgsHtml=c.msgs.length?c.msgs.map(m=>`<div class="cmsg ${m.who}"><span class="who">${m.who==='emp'?e(nm(c.uid)):e(D.counselName)}</span>${e(m.b)}</div>`).join(''):'<p class="mu" style="text-align:center">아직 대화가 없습니다. 편하게 이야기를 건네보세요.</p>';
return `<div class="counsel-wrap"><div class="counsel-msgs" id="cmsgs">${msgsHtml}</div><div style="display:flex;gap:8px"><input id="cinput" style="flex:1" placeholder="이야기를 들려주세요..." oninput="counselDraft=this.value" onkeydown="if(event.key==='Enter'){event.preventDefault();sendCounsel(${c.id},${isAdmin})}"><button class="btn" style="flex:none;white-space:nowrap" onclick="sendCounsel(${c.id},${isAdmin})">전송</button></div></div>`}
function startCounsel(){const td=today();if(D.counsel.some(c=>c.uid===S.uid&&c.date===td))return;
D.counsel.push({id:nx(D.counsel),uid:S.uid,date:td,msgs:[],unreadEmp:0,unreadAdm:1});save();R()}
function sendCounsel(id,isAdmin){const c=D.counsel.find(x=>x.id===id);if(!c)return;
const val=($('#cinput')?.value||'').trim();if(!val)return;
c.msgs.push({who:isAdmin?'adm':'emp',b:val,d:now()});
if(isAdmin)c.unreadEmp=1;else c.unreadAdm=1;
counselDraft='';save();R()}
P.admin=()=>{if(!adm())return'';const t=S.tab;
if(t==='an')return card('공지사항 작성',`<div style="max-width:640px">${fld('nt','제목 (필수)')}<label>본문 (필수)</label><textarea id="nb"></textarea><label class="ck"><input type="checkbox" id="ni">중요 공지로 표시</label><label class="ck"><input type="checkbox" id="nc">오염된 공지로 표시</label>${fld('ncov','오염 안내 문구 (선택, 비우면 기본 문구 사용)')}<button class="pri" onclick="addN()">공지 등록</button></div>`);
if(t==='set')return card('사이트 설정',`<div style="max-width:640px">${fld('sco','회사명','text',`value="${e(D.co)}"`)}${fld('smk','관리자 마크 라벨','text',`value="${e(D.mark)}"`)}<h4>메뉴 설정</h4><table><tr><th>메뉴</th><th>이름</th><th>표시</th></tr>${D.menus.map((m,i)=>`<tr><td>${m.k}</td><td><input id="mn${i}" value="${e(m.n)}"></td><td><input type="checkbox" id="mv${i}" ${m.v?'checked':''} ${m.k==='admin'?'disabled':''}></td></tr>`).join('')}</table><h4>상담 탭 설정</h4><label>안내 문구 (상담 시작 전 표시)</label><textarea id="sci" style="min-height:90px">${e(D.counselIntro)}</textarea>${fld('scn','상담사 표시 이름','text',`value="${e(D.counselName)}"`)}<button class="pri" onclick="saveSet()">저장</button></div>`);
const rows=D.users.map(u=>{const main=u.role==='main';return`<tr><td>${e(u.id)}</td><td>${e(u.name)}${u.role!=='user'?MK():''}</td><td>${e(u.dept)}</td><td>${e(u.rank)}</td><td>${u.pts} P</td><td>${main?'메인 관리자':u.role==='admin'?'관리자':'사원'}</td><td class="${u.off?'rd':''}">${u.off?'비활성':'정상'}</td><td class="nw"><button class="btn" onclick="editU('${u.id}')">수정</button> <button class="btn" onclick="togU('${u.id}')">${u.off?'활성화':'비활성'}</button> ${main?'':`<button class="btn" onclick="roleU('${u.id}')">${u.role==='admin'?'관리자 해임':'관리자 임명'}</button> `}<button class="btn dg" onclick="delU('${u.id}')">삭제</button></td></tr>`});
return`<div class="two">${card('사원 목록',tbl(['아이디','이름','부서','직급','포인트','권한','상태','관리'],rows))}<div class="card side"><h3>계정 생성</h3>${fld('cid','아이디 (필수)')}${fld('cpw','비밀번호 (필수)','password')}${fld('cnm','이름 (필수)')}${fld('cdp','부서')}${fld('ctm','소속 팀')}${fld('cal','가면(호칭)')}${fld('crk','직급')}<button class="pri" onclick="addU()">계정 생성</button></div></div>`};
function addN(){if(!need())return;const t=v('nt'),b=v('nb');if(!t||!b)return alert('제목과 본문은 필수입니다.');D.notices.push({id:nx(D.notices),t,b,imp:$('#ni').checked?1:0,corrupted:$('#nc').checked?1:0,cover:v('ncov'),d:now(),seenBy:[S.uid]});save();S.pg='notices';R()}
function saveSet(){if(!need())return;D.co=v('sco')||D.co;D.mark=v('smk')||D.mark;D.menus.forEach((m,i)=>{m.n=v('mn'+i)||m.n;m.v=m.k==='admin'||$('#mv'+i).checked?1:0});
if($('#sci'))D.counselIntro=$('#sci').value.trim()||D.counselIntro;
if($('#scn'))D.counselName=v('scn')||D.counselName;
save();R();alert('저장되었습니다.')}
function addU(){if(!need())return;const id=v('cid'),pw=$('#cpw').value,n=v('cnm');
if(!id||!pw||!n)return alert('아이디, 비밀번호, 이름은 필수입니다.');if(!/^[A-Za-z0-9_]+$/.test(id))return alert('아이디는 영문, 숫자, 밑줄만 사용할 수 있습니다.');if(U(id))return alert('이미 사용 중인 아이디입니다.');
D.users.push({id,pw,name:n,dept:v('cdp'),team:v('ctm'),alias:v('cal'),rank:v('crk'),pts:0,role:'user',off:0,reason:'',buys:{},cbuys:{}});save();R()}
function editU(id){if(!need())return;const u=U(id);
modal('사원 정보 수정','',`<div style="max-width:420px">${fld('eu_id','아이디','text',`value="${e(u.id)}" disabled`)}${fld('eu_pw','비밀번호','text',`value="${e(u.pw)}"`)}${fld('eu_name','이름 (필수)','text',`value="${e(u.name)}"`)}${fld('eu_dept','부서','text',`value="${e(u.dept)}"`)}${fld('eu_team','소속 팀','text',`value="${e(u.team)}"`)}${fld('eu_alias','가면(호칭)','text',`value="${e(u.alias)}"`)}${fld('eu_rank','직급','text',`value="${e(u.rank)}"`)}<button class="pri" onclick="saveU('${id}')">저장</button></div>`)}
function saveU(id){const u=U(id),name=$('#eu_name').value.trim();if(!name)return alert('이름은 비울 수 없습니다.');
u.pw=$('#eu_pw').value.trim()||u.pw;u.name=name;u.dept=$('#eu_dept').value.trim();u.team=$('#eu_team').value.trim();u.alias=$('#eu_alias').value.trim();u.rank=$('#eu_rank').value.trim();
save();document.querySelector('.ov')?.remove();R()}
function togU(id){if(!need())return;const u=U(id);
if(u.off){u.off=0;u.reason='';save();R();return}
if(u.role==='main')return alert('메인 관리자는 비활성화할 수 없습니다.');
const r=prompt('비활성화 사유를 입력하십시오.\n(로그인 시도 시 사원에게 이 문구가 표시됩니다.)','비활성화된 계정입니다. 관리자에게 문의하십시오.');
if(r===null)return;if(!r.trim())return alert('사유를 입력해야 비활성화할 수 있습니다.');
u.off=1;u.reason=r.trim();save();R()}
function roleU(id){if(!need())return;const u=U(id);if(u.role==='main')return;u.role=u.role==='admin'?'user':'admin';save();R()}
function delU(id){if(!need())return;const u=U(id);if(u.role==='main')return alert('메인 관리자는 삭제할 수 없습니다.');if(!confirm(`${u.name} 계정을 삭제할까요?`))return;D.users=D.users.filter(x=>x.id!==id);save();R()}
boot();
</script></body></html>
