<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>백일몽 주식회사 사내 인트라넷</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#222839;--mu:#727b8d;--ln:#e9edf4;--nv:#14213e;--nv2:#25407a;--ac:#eef3fb;--gd:#3f68ad;--gr:#1f7a5c;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f131c;--card:#181e2b;--tx:#e7e6e1;--mu:#8d95a5;--ln:#2a3142;--nv:#0a1120;--nv2:#1c356b;--ac:#1c2840;--gd:#6f9ce8;--gr:#3aa780;--rd:#e2685a}}
:root[data-theme="dark"]{--bg:#0f131c;--card:#181e2b;--tx:#e7e6e1;--mu:#8d95a5;--ln:#2a3142;--nv:#0a1120;--nv2:#1c356b;--ac:#1c2840;--gd:#6f9ce8;--gr:#3aa780;--rd:#e2685a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.55 Pretendard,"Malgun Gothic","Apple SD Gothic Neo",-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,var(--nv),var(--nv2) 130%);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:13px 24px;gap:10px;flex-wrap:wrap;box-shadow:0 1px 0 rgba(0,0,0,.1)}

.pts{color:#fff;font-weight:700}
.clk{font-variant-numeric:tabular-nums;color:#9fb0cc;font-size:12px}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--gr);box-shadow:0 0 0 3px rgba(31,122,92,.25)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.led.sy{animation:pulse 1.4s ease-in-out infinite}.led.er{background:var(--rd);box-shadow:0 0 0 3px rgba(179,57,44,.25)}
.out{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:20px;cursor:pointer;margin-left:4px;transition:background .15s}
.out:hover{background:rgba(255,255,255,.18)}
#bd{display:flex;min-height:calc(100vh - 50px)}
nav{width:206px;background:var(--nv);flex:none;padding:14px 10px}

.nav-sep{height:1px;background:rgba(255,255,255,.14);margin:10px 10px 11px}
main{flex:1;min-width:0;padding:24px 26px}
main.fadein{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--ln);margin-bottom:18px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 18px;cursor:pointer;color:var(--mu);font-size:13.5px;border-radius:10px 10px 0 0;transition:background .12s,color .12s;font:inherit}
.tabs button:hover{background:var(--ac);color:var(--tx)}
.tabs button.on{background:var(--ac);color:var(--nv2);font-weight:600;box-shadow:inset 0 -3px 0 var(--gd)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 2px 10px rgba(20,40,80,.05)}
.card h3{margin:0 0 14px;font-size:16.5px;font-weight:700}
.two{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.two>.card:first-child{flex:1 1 420px;min-width:0}.side{flex:0 0 300px}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse}
th{color:var(--mu);font-weight:600;font-size:12.5px;text-transform:none}th,td{padding:12px 8px;text-align:center;border-bottom:1px solid var(--ln)}
tbody tr:hover td{background:var(--ac)}
td.l{text-align:left}td a{color:var(--tx);cursor:pointer}td a:hover{color:var(--nv2);text-decoration:underline}.nw{white-space:nowrap}
.kv th{background:var(--ac);width:150px;color:var(--mu);text-align:left;border-radius:8px 0 0 8px}.kv td{text-align:left}
.btn{background:var(--card);color:var(--tx);border:1px solid var(--ln);padding:6px 13px;border-radius:20px;cursor:pointer;font-size:12px;transition:transform .1s,box-shadow .1s,background .12s}
.btn:hover{background:var(--ac);box-shadow:0 2px 6px rgba(20,40,80,.1);transform:translateY(-1px)}
.btn.dg,.rd{color:var(--rd)}.btn.dg{border-color:var(--rd)}
.pri{background:var(--gd);color:#fff;border:0;padding:10px 20px;border-radius:22px;cursor:pointer;font-size:13.5px;font-weight:600;transition:background .12s,transform .1s;box-shadow:0 2px 8px rgba(63,104,173,.25)}
.pri:hover{background:var(--nv2);transform:translateY(-1px)}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}label.ck{display:flex;gap:6px;align-items:center;color:var(--tx);font-size:13px}
input:not([type=checkbox]),select,textarea{width:100%;box-sizing:border-box;padding:10px 13px;border:1px solid var(--ln);border-radius:11px;background:var(--card);color:var(--tx);font:inherit;transition:border-color .12s,box-shadow .12s}

textarea{min-height:130px}.pri{margin-top:14px}.mu{color:var(--mu);font-size:13px}
.mk{color:var(--gd);background:var(--ac);padding:1px 7px;border-radius:20px;font-style:normal;font-size:11px;font-weight:600}
.grid{display:flex;gap:14px;flex-wrap:wrap}.prod{flex:0 0 220px;border:1px solid var(--ln);border-radius:16px;padding:16px;background:var(--card);transition:box-shadow .15s,transform .15s}
.prod:hover{box-shadow:0 4px 14px rgba(20,25,40,.08);transform:translateY(-2px)}

.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--rd);margin-left:5px;vertical-align:middle}

.b-ok{background:rgba(31,122,92,.12);color:var(--gr)}.b-no{background:rgba(179,57,44,.12);color:var(--rd)}.b-wt{background:var(--ac);color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(15,19,28,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;animation:fade .15s ease}
.md{background:var(--card);border-radius:20px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:26px;position:relative;box-shadow:0 20px 50px rgba(15,25,50,.18)}
.md .x{position:absolute;top:16px;right:18px;cursor:pointer;color:var(--mu);border:0;background:none;font-size:18px;line-height:1}
.md h3{margin:0 24px 6px 0}.md h3:empty{display:none;margin:0}.md .mt{color:var(--mu);font-size:12px;margin-bottom:14px}.md .bd{white-space:pre-wrap;line-height:1.65}
.syn{color:var(--mu);font-size:11.5px;text-align:center;padding:10px 12px}
#lg{max-width:420px;margin:15vh auto;background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:36px;box-shadow:0 16px 44px rgba(20,40,80,.08);animation:fade .3s ease}
#lg small.mu{letter-spacing:.3px}
#lg h2{margin:4px 0 20px;padding-bottom:14px;border-bottom:1px solid var(--ln);color:var(--nv)}#lerr{color:var(--rd);font-size:13px;margin-top:10px;min-height:18px}
.corrupt{position:relative;display:inline;animation:gl var(--cp-speed,2s) infinite;font-family:var(--cp-font,inherit)}
@keyframes gl{0%{text-shadow:calc(var(--cp-shake,2px)*-1) 0 var(--cp-c1,#ff3b6b),var(--cp-shake,2px) 0 var(--cp-c2,#3ddc84)}2%{text-shadow:var(--cp-shake,2px) 1px var(--cp-c1,#ff3b6b),calc(var(--cp-shake,2px)*-1) -1px var(--cp-c2,#3ddc84)}4%{text-shadow:calc(var(--cp-shake,2px)*-.5) 0 var(--cp-c1,#ff3b6b),calc(var(--cp-shake,2px)*.5) 0 var(--cp-c2,#3ddc84)}6%,100%{text-shadow:none}}
.md.corrupt{background:#07080c;border:1px solid var(--cp-c1,#ff3b6b);box-shadow:0 20px 50px rgba(255,59,107,.15);color:#fff}
.md.corrupt .x{color:var(--cp-c1,#ff3b6b);border-color:var(--cp-c1,#ff3b6b);z-index:2;background:#07080c}
.md.corrupt .mt,.md.corrupt .mu{color:#fff}
.md.corrupt{overflow:hidden}
.corrupt-img{position:absolute;inset:0;z-index:0;background-size:cover;background-position:center;filter:contrast(1.05) saturate(.85)}
.corrupt-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(7,8,12,.15) 0%,rgba(7,8,12,.5) 45%,rgba(7,8,12,.92) 100%)}
.corrupt-content{position:relative;z-index:1}
.spoiler-box{margin-top:12px;padding:18px 16px;border:1px dashed var(--ln);border-radius:12px;background:var(--ac);color:var(--mu);text-align:center;font-size:13px;letter-spacing:.3px}
.md.cosmic{background:#070a1c;border:3px dashed #ffd23f;box-shadow:0 0 0 6px #070a1c,0 0 40px rgba(255,210,63,.35);
background-image:radial-gradient(1.6px 1.6px at 15px 25px,#fff,transparent),radial-gradient(1.2px 1.2px at 75px 65px,#fff,transparent),radial-gradient(1.4px 1.4px at 130px 15px,#fff,transparent),radial-gradient(1px 1px at 45px 95px,#fff,transparent),radial-gradient(1.8px 1.8px at 100px 110px,#fff,transparent),radial-gradient(1.2px 1.2px at 160px 80px,#fff,transparent);background-size:180px 140px}
.md.cosmic .x{color:#ffd23f;background:#070a1c;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;border:1px solid #ffd23f}
.cosmic-title{text-align:center;font-family:'Comic Sans MS','Apple SD Gothic Neo',sans-serif;font-weight:900;font-size:30px;letter-spacing:1px;margin:4px 0 2px;transform:rotate(-2deg);
background:linear-gradient(90deg,#ff3b3b,#ff9a3b,#ffe63b,#5cff5c,#3bc6ff,#a35cff,#ff3bd8);-webkit-background-clip:text;background-clip:text;color:transparent;
animation:rainbow-move 3s linear infinite,wig 1.8s ease-in-out infinite;background-size:200% auto;text-shadow:0 0 18px rgba(255,255,255,.25)}
@keyframes rainbow-move{to{background-position:200% center}}
@keyframes wig{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

.cosmic-intro{color:#ffe27a;font-family:'Comic Sans MS','Apple SD Gothic Neo',sans-serif;background:rgba(255,255,255,.05);border:1px dashed #ffd23f;padding:12px 15px;border-radius:10px;line-height:1.6;text-align:center;animation:flick 2.4s infinite}

.md.cosmic h4{color:#ffe27a;font-family:'Comic Sans MS','Apple SD Gothic Neo',sans-serif}
.md.cosmic .prod{background:rgba(255,255,255,.04);border:2px solid transparent;border-image:linear-gradient(90deg,#ff3b3b,#ffe63b,#5cff5c,#3bc6ff,#a35cff) 1;border-radius:14px}
.md.cosmic .prod b{color:#fff}.md.cosmic .prod p{color:#b9c2e0}
.cosmic-hide{display:block;text-align:center;color:#8892b8;font-size:12px;margin-top:16px}.cosmic-hide input{margin-right:5px}
.counsel-wrap{background:linear-gradient(160deg,var(--cc-bg1,#fff8f0),var(--cc-bg2,#ffead2));border:1px solid var(--cc-bd,#ffdcb0);border-radius:16px;padding:18px}
.counsel-intro{text-align:center;color:var(--cc-txt,#8a4b16)}
.counsel-intro svg{width:34px;height:34px;stroke:var(--cc-acc,#c9832f)}
.counsel-msgs{display:flex;flex-direction:column;gap:10px;max-height:420px;overflow-y:auto;padding:6px 4px;margin-bottom:14px}
.cmsg{max-width:74%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.cmsg.emp{align-self:flex-end;background:var(--cc-emp,#ffb46e);color:var(--cc-empt,#3a2410);border-bottom-right-radius:4px}
.cmsg.adm{align-self:flex-start;background:var(--cc-adm,#fff);border:1px solid var(--cc-bd,#ffdcb0);color:var(--cc-admt,#5a3a1a);border-bottom-left-radius:4px}
.cmsg .who{display:block;font-size:10.5px;opacity:.6;margin-bottom:3px}
.counsel-wrap input{border-color:var(--cc-bd,#ffdcb0)}
.ccolor-row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0}
.ccolor-row label{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--mu);margin:0}
.ccolor-row input[type=color]{width:44px;height:32px;padding:2px;border-radius:8px;cursor:pointer}
.feed{display:flex;flex-direction:column;gap:14px}
.fpost{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px}
.fpost-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.favatar{width:36px;height:36px;border-radius:50%;background:var(--ac);color:var(--nv2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none;font-size:14px}
.fname{font-weight:600;font-size:13.5px}
.fdate{color:var(--mu);font-size:11.5px}
.fpost-title{font-weight:700;margin-bottom:4px;cursor:pointer}
.fpost-body{white-space:pre-wrap;line-height:1.55;cursor:pointer;color:var(--tx)}
.fpost-img{margin-top:10px;width:220px;height:220px;object-fit:cover;border-radius:12px;display:block;cursor:pointer;background:var(--ac)}
.fpost-actions{display:flex;gap:6px;margin-top:12px;border-top:1px solid var(--ln);padding-top:10px}
.flike,.fcmt{background:none;border:0;cursor:pointer;color:var(--mu);font-size:13px;display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;font:inherit}
.flike:hover,.fcmt:hover{background:var(--ac)}
.flike.on{color:var(--rd)}
.invlog{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:4px 2px;margin-bottom:14px}
.ivnarr{background:var(--ac);border-radius:12px;padding:12px 14px;line-height:1.6;white-space:pre-wrap}
.ivchat{padding:8px 12px;border-radius:12px;background:var(--card);border:1px solid var(--ln);max-width:80%;align-self:flex-start}

.ivchoice{background:var(--ac);border-radius:12px;padding:12px 14px;white-space:pre-wrap;line-height:1.6}
.ivopt{margin:4px 6px 0 0}
.ivopt.win{background:var(--gr);color:#fff;border-color:var(--gr)}
.ivdice{align-self:center;text-align:center;color:var(--mu);font-size:12.5px;background:transparent;border:1px dashed var(--ln);border-radius:10px;padding:6px 12px}
.ivdice b{color:var(--tx)}
.gm-wrap{display:flex;justify-content:center;margin-bottom:16px}
.gm-machine{width:100%;max-width:380px;background:linear-gradient(180deg,#1b2131,#141926);border-radius:18px;padding:0 0 16px;box-shadow:0 12px 32px rgba(0,0,0,.4),0 0 44px rgba(70,80,130,.12);position:relative;overflow:hidden;border:1px solid #333c54}
.gm-top{height:14px;background:#10141f;border-bottom:1px solid #333c54}
.gm-dome{position:relative;margin:14px 14px 0;height:140px;background:linear-gradient(165deg,#232b40,#12151f);border-radius:14px;border:1px solid #333c54;overflow:hidden;box-shadow:inset 0 -14px 26px rgba(0,0,0,.45),inset 0 10px 18px rgba(130,150,200,.06)}
.gm-domeshine{position:absolute;top:-30px;left:-20px;width:120px;height:120px;background:rgba(170,190,230,.07);border-radius:50%;transform:rotate(20deg)}
.gm-bubble{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.4),inset -4px -6px 10px rgba(0,0,0,.35),inset 3px 5px 8px rgba(255,255,255,.12);border:1px solid rgba(170,190,230,.25);filter:saturate(.75) brightness(.85)}
.gm-b1{width:60px;height:60px;top:14px;left:24px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),#8a742f 55%,#5c4a1e)}
.gm-b2{width:68px;height:68px;top:34px;right:18px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),#3f5d78 55%,#283e52)}
.gm-b3{width:54px;height:54px;bottom:8px;left:94px;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.18),#6b3a46 55%,#44232c)}
.gm-empty .gm-bubble{filter:grayscale(.7) brightness(.6);opacity:.45}

.gm-screen{background:#060810;color:#8fd3cf;font-size:11px;text-align:center;border-radius:6px;padding:7px 10px;margin-bottom:12px;font-family:'Courier New',monospace;letter-spacing:.2px;line-height:1.5;border:1px solid #1c2436;text-shadow:0 0 6px rgba(143,211,207,.35)}

reader.onerror=reject;reader.readAsDataURL(file)})}

let seenCache=null;
function localSeen(){if(!seenCache){try{seenCache=JSON.parse(localStorage.getItem('SEEN_'+S.uid)||'{}')}catch(x){seenCache={}}}return seenCache}
function saveSeenLocal(){try{localStorage.setItem('SEEN_'+S.uid,JSON.stringify(seenCache||{}))}catch(x){}}
const seenL=(type,id)=>(localSeen()[type]||[]).includes(id);
function markSeenL(type,id){const s=localSeen();s[type]=s[type]||[];if(!s[type].includes(id)){s[type].push(id);saveSeenLocal()}}
const caseSeenId=caseId=>(localSeen().inv||{})[caseId]||0;
function markCaseSeenL(c){const s=localSeen();s.inv=s.inv||{};s.inv[c.id]=c.log.length?c.log[c.log.length-1].id:0;saveSeenLocal()}

function ensureFontLoaded(url,family){if(!url||loadedFonts.has(url))return;loadedFonts.add(url);
const m=url.match(/\.(woff2?|ttf|otf)(\?.*)?$/i);
if(m){const fam=(family||'').split(',')[0].trim().replace(/^['"]|['"]$/g,'')||('f'+Date.now());
const ext=m[1].toLowerCase();const fmt=ext==='woff2'?'woff2':ext==='woff'?'woff':ext==='ttf'?'truetype':'opentype';
const st=document.createElement('style');
st.textContent=`@font-face{font-family:'${fam.replace(/'/g,"\\'")}';src:url('${url}') format('${fmt}');font-display:swap}`;
document.head.appendChild(st);return}

function bgmSetTrack(caseId){if(!need())return;const url=($('#bgm_url')?.value||'').trim();const id=extractYtId(url);

if(!c.bgm.playing){c.bgm.posAt=Date.now();c.bgm.playing=true}})}
function bgmPause(caseId){if(!need())return;saveTx(latest=>{const c=latest.inv.cases.find(x=>x.id===caseId);if(!c||!c.bgm)return;

let ytApiQueue=[],ytPlayer=null,ytPlayerVideoId=null,ytPlayerReady=false;
let bgmVol=(()=>{const raw=localStorage.getItem('BGM_VOL');if(raw===null)return 50;const v=+raw;return isFinite(v)&&v>=0&&v<=100?v:50})();

function currentBgmCase(){if(S.pg!=='inv'||!S.invOpen||!D||!D.inv)return null;return D.inv.cases.find(x=>x.id===S.invOpen)||null}
function syncBgm(){const c=currentBgmCase();const bgm=c&&c.bgm;

ensureYtApi(()=>{
if(!ytPlayer){ytPlayer=new YT.Player('ytbgmplayer',{height:'1',width:'1',videoId:bgm.videoId,playerVars:{autoplay:0,controls:0,disablekb:1,modestbranding:1,playsinline:1},
events:{onReady:()=>{ytPlayerReady=true;ytPlayer.setVolume(bgmVol);if(bgmMuted)ytPlayer.mute();else ytPlayer.unMute();applyBgmState()}}});
return}
if(ytPlayerReady)applyBgmState()})}
function applyBgmState(){const c=currentBgmCase();const bgm=c&&c.bgm;if(!ytPlayer||!ytPlayerReady||!bgm||!bgm.videoId)return;
const pos=(bgm.pos||0)+(bgm.playing?(Date.now()-bgm.posAt)/1000:0);
if(ytPlayerVideoId!==bgm.videoId){ytPlayerVideoId=bgm.videoId;
if(bgm.playing)ytPlayer.loadVideoById({videoId:bgm.videoId,startSeconds:Math.max(0,pos)});
else ytPlayer.cueVideoById({videoId:bgm.videoId,startSeconds:Math.max(0,pos)});
return}
const state=ytPlayer.getPlayerState();
if(bgm.playing){if(state!==1){try{ytPlayer.seekTo(Math.max(0,pos),true)}catch(x){}ytPlayer.playVideo()}}
else{if(state===1||state===3){ytPlayer.pauseVideo()}}}

if(ytPlayer&&ytPlayerReady)ytPlayer.setVolume(bgmVol)}

function claimSlot(caseId,idx){const c=D.inv.cases.find(x=>x.id===caseId);if(!c||c.status!=='active')return alert('종료된 시나리오입니다.');

c.slots[idx]=S.uid;save();R()}
function releaseSlot(caseId,idx){const c=D.inv.cases.find(x=>x.id===caseId);if(!c)return;if(c.slots[idx]!==S.uid&&!adm())return;
c.slots[idx]=null;save();R()}
function postNarr(caseId){if(!need())return;const c0=D.inv.cases.find(x=>x.id===caseId);if(!c0)return;const t=($('#iv_narr')?.value||'').trim();if(!t)return alert('서술 내용을 입력하세요.');
const optsRaw=v('iv_opts');const opts=optsRaw?optsRaw.split(',').map(s=>s.trim()).filter(Boolean).map((label,i)=>({id:String.fromCharCode(97+i),label})):[];
delete drafts['iv_narr'];delete drafts['iv_opts'];const na=$('#iv_narr'),no=$('#iv_opts');if(na)na.value='';if(no)no.value='';
saveTx(latest=>{const c=latest.inv.cases.find(x=>x.id===caseId);if(!c)return;const id=nx(c.log);c.log.push(opts.length?{id,type:'choice',text:t,options:opts,votes:{},resolved:null,d:now()}:{id,type:'narr',text:t,d:now()})})}
function postChat(caseId){const c0=D.inv.cases.find(x=>x.id===caseId);if(!c0||c0.status!=='active'||(!c0.slots.includes(S.uid)&&!adm()))return;
const inp=$('#iv_chat');const t=(inp?.value||'').trim();if(!t)return;delete drafts['iv_chat'];if(inp)inp.value='';
saveTx(latest=>{const c=latest.inv.cases.find(x=>x.id===caseId);if(!c)return;c.log.push({id:nx(c.log),type:'chat',uid:S.uid,text:t,d:now()})})}
function rollStatDice(caseId){const c0=D.inv.cases.find(x=>x.id===caseId);if(!c0||c0.status!=='active'||!c0.slots.includes(S.uid))return;
const statKey=$('#iv_stat')?.value||'str',u=me(),mod=(u.stats&&u.stats[statKey])??0;
const d1=1+Math.floor(Math.random()*6),d2=1+Math.floor(Math.random()*6),total=d1+d2+mod;
saveTx(latest=>{const c=latest.inv.cases.find(x=>x.id===caseId);if(!c)return;c.log.push({id:nx(c.log),type:'dice',mode:'stat',uid:S.uid,statKey,mod,d1,d2,total,d:now()})})}
function rollCustomDice(caseId){const c0=D.inv.cases.find(x=>x.id===caseId);if(!c0||c0.status!=='active'||!c0.slots.includes(S.uid))return;
const raw=($('#iv_dice')?.value||'').trim();const m=raw.match(/^(\d*)d(\d+)([+-]\d+)?$/i);if(!m)return alert('주사위 표기법이 올바르지 않습니다. 예: 2d6, 1d100+5');
const n=Math.min(20,Math.max(1,+m[1]||1)),sides=Math.max(2,+m[2]),mod=+m[3]||0;
const rolls=Array.from({length:n},()=>1+Math.floor(Math.random()*sides));
const total=rolls.reduce((a,b)=>a+b,0)+mod;
if($('#iv_dice'))$('#iv_dice').value='';
saveTx(latest=>{const c=latest.inv.cases.find(x=>x.id===caseId);if(!c)return;c.log.push({id:nx(c.log),type:'dice',mode:'custom',uid:S.uid,notation:raw,rolls,mod,total,d:now()})})}
function resolveChoice(en){const tally={};Object.values(en.votes||{}).forEach(o=>tally[o]=(tally[o]||0)+1);
let win=en.options[0].id,max=-1;en.options.forEach(o=>{const c=tally[o.id]||0;if(c>max){max=c;win=o.id}});en.resolved=win}
function voteChoice(caseId,entryId,optId){const c=D.inv.cases.find(x=>x.id===caseId);if(!c||c.status!=='active'||!c.slots.includes(S.uid))return;
const en=c.log.find(x=>x.id===entryId);if(!en||en.type!=='choice'||en.resolved)return;
en.votes=en.votes||{};en.votes[S.uid]=optId;
const filled=c.slots.filter(Boolean);if(filled.length&&filled.every(u=>en.votes[u]!==undefined))resolveChoice(en);
save();R()}
function resolveChoiceForce(caseId,entryId){if(!need())return;const c=D.inv.cases.find(x=>x.id===caseId);const en=c.log.find(x=>x.id===entryId);
if(!en||en.resolved)return;resolveChoice(en);save();R()}

function branchCase(parentId){if(!need())return;const p=D.inv.cases.find(x=>x.id===parentId);const t=prompt('분기 시나리오 제목을 입력하세요.');if(!t)return;

D.inv.cases.push(nc);save();S.invOpen=nc.id;R()}
function deleteCase(id){if(!need()||!confirm('시나리오를 삭제할까요? 하위 분기도 함께 삭제됩니다.'))return;
const ids=new Set([id]);let ch=true;while(ch){ch=false;D.inv.cases.forEach(c=>{if(c.parentId&&ids.has(c.parentId)&&!ids.has(c.id)){ids.add(c.id);ch=true}})}
D.inv.cases=D.inv.cases.filter(c=>!ids.has(c.id));if(S.invOpen&&ids.has(S.invOpen))S.invOpen=null;save();R()}

function changeUserId(oldId,newId){
D.users.forEach(u=>{if(u.id===oldId)u.id=newId;(u.items||[]).forEach(it=>{if(it.origin===oldId)it.origin=newId})});
(D.msgs||[]).forEach(m=>{if(m.from===oldId)m.from=newId;if(m.to===oldId)m.to=newId;if(Array.isArray(m.readBy)){const i=m.readBy.indexOf(oldId);if(i>=0)m.readBy[i]=newId}});
(D.reports||[]).forEach(r=>{if(r.who===oldId)r.who=newId;if(Array.isArray(r.seenBy)){const i=r.seenBy.indexOf(oldId);if(i>=0)r.seenBy[i]=newId}});
(D.counsel||[]).forEach(c=>{if(c.uid===oldId)c.uid=newId});
(D.posts||[]).forEach(p=>{if(p.uid===oldId)p.uid=newId;if(Array.isArray(p.likes)){const i=p.likes.indexOf(oldId);if(i>=0)p.likes[i]=newId}
(p.comments||[]).forEach(c=>{if(c.uid===oldId)c.uid=newId})});
(D.inv?.cases||[]).forEach(c=>{c.slots=(c.slots||[]).map(s=>s===oldId?newId:s);
(c.log||[]).forEach(en=>{if(en.uid===oldId)en.uid=newId;if(en.votes&&Object.prototype.hasOwnProperty.call(en.votes,oldId)){en.votes[newId]=en.votes[oldId];delete en.votes[oldId]}})});
(D.log||[]).forEach(l=>{if(l.u===oldId)l.u=newId});
if(S.uid===oldId){S.uid=newId;try{localStorage.setItem(UK,newId)}catch(x){}}
}
function saveU(id){const u=U(id),name=$('#eu_name').value.trim();if(!name)return alert('이름은 비울 수 없습니다.');
const newId=($('#eu_id')?.value||'').trim();
if(!newId)return alert('아이디는 비울 수 없습니다.');
if(!/^[A-Za-z0-9_]+$/.test(newId))return alert('아이디는 영문, 숫자, 밑줄만 사용할 수 있습니다.');
if(newId!==id&&U(newId))return alert('이미 사용 중인 아이디입니다.');
if(newId!==id)changeUserId(id,newId);
u.pw=$('#eu_pw').value.trim()||u.pw;u.name=name;u.dept=$('#eu_dept').value.trim();u.team=$('#eu_team').value.trim();u.alias=$('#eu_alias').value.trim();u.rank=$('#eu_rank').value.trim();
u.stats=u.stats||{};Object.keys(STATN).forEach(k=>{const el=$('#eu_'+k);if(el)u.stats[k]=Math.max(0,Math.min(20,+el.value||0))});
save();document.querySelector('.ov')?.remove();R()}
function togU(id){if(!need())return;const u=U(id);
if(u.off){u.off=0;u.reason='';save();R();return}
if(u.role==='main')return alert('메인 관리자는 비활성화할 수 없습니다.');
const r=prompt('비활성화 사유를 입력하십시오.\n(로그인 시도 시 사원에게 이 문구가 표시됩니다.)','비활성화된 계정입니다. 관리자에게 문의하십시오.');
if(r===null)return;if(!r.trim())return alert('사유를 입력해야 비활성화할 수 있습니다.');
u.off=1;u.reason=r.trim();save();R()}
function roleU(id){if(!need())return;const u=U(id);if(u.role==='main')return;u.role=u.role==='admin'?'user':'admin';save();R()}
function delU(id){if(!need())return;const u=U(id);if(u.role==='main')return alert('메인 관리자는 삭제할 수 없습니다.');if(!confirm(`${u.name} 계정을 삭제할까요?`))return;D.users=D.users.filter(x=>x.id!==id);save();R()}
boot();
</script></body></html>
